[package]
name = "nixman"
version = "0.1.0"
edition = "2021"
description = "TUI for managing a multi-host NixOS flake: packages, flake inputs, rebuilds, git"

[dependencies]
anyhow = "1"
ctrlc = "3"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
